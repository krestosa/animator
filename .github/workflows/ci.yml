name: CI

on:
  push:
    branches:
      - mvp
      - electron-light
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BROWSERS_PATH: .animator-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: animator-repository-${{ github.sha }}
          path: |
            .
            !node_modules
            !.animator-browsers
            !.cache
          include-hidden-files: true
          retention-days: 1
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Electron desktop smoke
        run: xvfb-run -a node_modules/.bin/electron ./desktop-dist/desktop/main.js --production --smoke-test --no-sandbox
      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Disk write safety
        run: node e2e/disk-safety.mjs
      - name: Capture actual editor UI
        run: |
          PORT=4173 NODE_ENV=production node server-dist/server/index.js --production > /tmp/animator-ui.log 2>&1 &
          echo $! > /tmp/animator-ui.pid
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { chromium } from '@playwright/test';
          const base='http://127.0.0.1:4173';
          for(let i=0;i<120;i++){
            try{const response=await fetch(`${base}/api/health`);if(response.ok)break;}catch{}
            if(i===119)throw new Error('Animator server did not start');
            await new Promise(resolve=>setTimeout(resolve,100));
          }
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1536,height:900},deviceScaleFactor:1});
            await page.goto(base,{waitUntil:'networkidle'});
            await page.locator('.app').waitFor({state:'visible'});
            const more=page.locator('.toolbarMore>summary');
            if(await more.count())await more.click();
            const pathInput=page.locator('[data-path-input]');
            await pathInput.fill(path.join(process.cwd(),'fixture'));
            await page.locator('[data-action="open-project"]').click();
            await page.locator('[data-preview-frame]').waitFor({state:'attached',timeout:15000});
            await page.waitForTimeout(1200);
            if(await more.count())await more.evaluate(element=>{if(element instanceof HTMLDetailsElement)element.open=false;});
            await page.screenshot({path:'animator-ui-actual.png',fullPage:false});
          } finally { await browser.close(); }
          NODE
          kill $(cat /tmp/animator-ui.pid) || true
      - name: Upload actual editor UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: animator-ui-actual-${{ github.sha }}
          path: animator-ui-actual.png
          retention-days: 1
      - name: Timeline E2E
        run: node e2e/timeline.mjs
      - name: Record and input gate E2E
        run: node e2e/record-gate.mjs
      - name: Recorded viewport E2E
        run: node e2e/view-history.mjs
      - name: Browser preview E2E
        run: node e2e/browser-preview.mjs
      - name: Control API and CLI E2E
        run: node e2e/control-plane.mjs
      - name: Viewport screenshot E2E
        run: node e2e/viewport-screenshot.mjs
      - name: Theme override E2E
        run: node e2e/theme-live.mjs

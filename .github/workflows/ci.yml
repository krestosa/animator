name: CI

on:
  push:
    branches:
      - mvp
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BROWSERS_PATH: .animator-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: animator-repository-${{ github.sha }}
          path: |
            .
            !node_modules
            !.animator-browsers
          include-hidden-files: true
          retention-days: 1
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Timeline E2E
        run: node e2e/timeline.mjs
      - name: Record and input gate E2E
        run: node e2e/record-gate.mjs
      - name: Recorded viewport E2E
        run: node e2e/view-history.mjs
      - name: Browser preview E2E
        run: node e2e/browser-preview.mjs
      - name: Control API and CLI E2E
        run: node e2e/control-plane.mjs
      - name: Viewport screenshot E2E
        run: node e2e/viewport-screenshot.mjs
      - name: Theme override E2E
        run: node e2e/theme-live.mjs
